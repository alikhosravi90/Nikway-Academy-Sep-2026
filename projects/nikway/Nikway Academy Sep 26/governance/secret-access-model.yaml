id: NIKWAY-GOV-SECRET-ACCESS-001
level: 1
artifact:
  name: Identity, Access, and Secret Management Model
  status: proposed
purpose: Separate user access, passwords, secrets, API keys, certificates, and licenses while providing secure recovery.
identity:
  user_facing: [account, profile, password, passkeys, 2fa, sessions, recovery, roles, permissions, api_access]
  admin_infrastructure: [domains, ssl_tls, ports, apis, secrets, certificates, integrations]
separation_rules:
  - Password is not Secret
  - Secret is not API Key
  - API Key is not License
storage_rule: Secrets are stored in a dedicated manager or vault; the Control Center stores references and status.
source_refs: [pasted-text.txt]
