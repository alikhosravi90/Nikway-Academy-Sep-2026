services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nikway_v1
      POSTGRES_USER: nikway_app
      POSTGRES_PASSWORD: ${NIKWAY_POSTGRES_PASSWORD:?NIKWAY_POSTGRES_PASSWORD is required}
    volumes:
      - nikway-v1-postgres:/var/lib/postgresql/data
      - ./db/v1_schema.sql:/docker-entrypoint-initdb.d/001-v1-schema.sql:ro
    network_mode: bridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikway_app -d nikway_v1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nikway-v1-postgres:
